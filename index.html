<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05040f">
  <title>Nebula: Infinite Drift 3.0 | Uzay Savaş Oyunu</title>
  <meta name="description" content="Nebula 3.0 — kampanya sektörleri, dev boss savaşları, günlük görevler, gemi hangarı ve yükseltmelerle neon uzay atıcı oyunu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style.css?v=3.0.0">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="vignette"></div>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <div class="hull">
            <div class="hull-track"><i id="hull-fill"></i></div>
            <span id="hull-val">100</span>
          </div>
          <div class="hud-row"><div id="power" class="power"></div><div id="buffs" class="buffs"></div></div>
        </div>
        <div class="hud-center">
          <div id="score-val" class="score">0</div>
          <div id="combo" class="combo"></div>
        </div>
        <button id="btn-pause" class="icon-btn" aria-label="pause">❚❚</button>
      </div>
      <div id="objective" class="objective"></div>
      <button id="btn-special" class="special" aria-label="special"></button>
    </div>
    <div id="boss-bar" class="boss-bar hidden"></div>
    <div id="banner" class="banner"></div>
    <div id="toasts" class="toasts"></div>

    <!-- Screens -->
    <section id="scr-loading" class="screen active">
      <div class="loading">
        <div class="logo"><span class="logo-main" data-text="NEBULA">NEBULA</span><span class="logo-sub">INFINITE DRIFT</span></div>
        <div class="load-track"><i id="load-fill"></i></div>
      </div>
    </section>
    <section id="scr-menu" class="screen"></section>
    <section id="scr-map" class="screen"></section>
    <section id="scr-hangar" class="screen"></section>
    <section id="scr-missions" class="screen"></section>
    <section id="scr-settings" class="screen"></section>

    <!-- Modals -->
    <div id="modal-brief" class="modal"><div class="modal-box"></div></div>
    <div id="modal-pause" class="modal"><div class="modal-box"></div></div>
    <div id="modal-results" class="modal"><div class="modal-box"></div></div>
  </div>

  <script src="js/data.js?v=3.0.0"></script>
  <script src="js/save.js?v=3.0.0"></script>
  <script src="js/audio.js?v=3.0.0"></script>
  <script src="js/sprites.js?v=3.0.0"></script>
  <script src="js/game.js?v=3.0.0"></script>
  <script src="js/ui.js?v=3.0.0"></script>
  <script src="js/main.js?v=3.0.0"></script>
</body>
</html>
